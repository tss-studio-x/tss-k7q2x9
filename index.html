<!doctype html><html><head><meta charset=utf8><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Top Snap Studio</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
/* Layout: home = gallery of phone-shaped template cards in groups; make = numbered steps beside a sticky phone that plays the video. */
/* Look: warm paper background with a soft glow in the template colour, frosted-glass bar and cards, light large type, dark pill buttons. */
:root {
  --bg: #ebe8e3;
  --bg-2: #dccfc1;
  --glass: rgba(246, 245, 242, .62);
  --glass-line: rgba(255, 255, 255, .65);
  --surface: #f6f5f2;
  --field: rgba(255, 255, 255, .6);
  --ink: #1d1c1a;
  --muted: #6e6a64;
  --line: rgba(29, 28, 26, .1);
  --soft: rgba(29, 28, 26, .06);
  --peach: #f9dccb;
  --theme: #732a8f;          /* follows the template colour the user picks */
  --ok: #1f8a4c;
  --note: #9a5b00;
  --shadow: 0 24px 60px rgba(61, 41, 26, .1);
  --shadow-sm: 0 8px 24px rgba(61, 41, 26, .08);
  --display: "IBM Plex Sans Arabic", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans Arabic", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --r: 28px;
}
:root[lang="en"] {
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15130f; --bg-2: #0e0d0b; --glass: rgba(40, 37, 33, .6); --glass-line: rgba(255, 255, 255, .08); --surface: #24221e; --field: rgba(255, 255, 255, .05);
    --ink: #f3f1ed; --muted: #a39e96; --line: rgba(255, 255, 255, .1); --soft: rgba(255, 255, 255, .06); --peach: #3a2a20;
    --ok: #49c27f; --note: #e0a646; --shadow: 0 24px 60px rgba(0, 0, 0, .35); --shadow-sm: 0 8px 24px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15130f; --bg-2: #0e0d0b; --glass: rgba(40, 37, 33, .6); --glass-line: rgba(255, 255, 255, .08); --surface: #24221e; --field: rgba(255, 255, 255, .05);
  --ink: #f3f1ed; --muted: #a39e96; --line: rgba(255, 255, 255, .1); --soft: rgba(255, 255, 255, .06); --peach: #3a2a20;
  --ok: #49c27f; --note: #e0a646; --shadow: 0 24px 60px rgba(0, 0, 0, .35); --shadow-sm: 0 8px 24px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 140%) fixed; background-color: var(--bg); color: var(--ink); font: 15px/1.6 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--theme); outline-offset: 2px; }
.glow { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: var(--glow-l, none) center / cover no-repeat; } /* a ready-made picture per template colour: no live blur */
:root[dir="rtl"] .glow { transform: scaleX(-1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .glow { background-image: var(--glow-d, none); } }
:root[data-theme="dark"] .glow { background-image: var(--glow-d, none); }
.glass { background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--glass-line); } /* no backdrop blur: cheaper to draw */
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* top bar */
.bar { position: relative; z-index: 30; /* stays at the top of the page; doesn't follow the scroll */ max-width: 1520px; margin: 14px auto 0; display: flex; align-items: center; gap: 12px; padding: 9px 10px; padding-inline-start: 14px; border-radius: 34px; box-shadow: var(--shadow-sm); }
.brand { display: flex; align-items: center; gap: 9px; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", system-ui, sans-serif; font-weight: 600; font-size: 18px; letter-spacing: -.02em; direction: ltr; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; display: block; }
#brand-studio { font-weight: 400; color: var(--muted); }
.bar-end { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; }
.lang { border: 0; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 9px 18px; font-size: 14px; font-weight: 500; }

/* home */
#home { max-width: 1520px; margin: 0 auto; }
.home-head { padding-block: clamp(36px, 7vw, 76px) 18px; max-width: 760px; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
.badge { display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 6px 14px; border-radius: 999px; font-size: 13px; color: var(--ink); }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--theme); box-shadow: 0 0 0 4px color-mix(in srgb, var(--theme) 22%, transparent); }
.home-head h1 { font-family: var(--display); font-weight: 300; font-size: clamp(38px, 6.4vw, 66px); line-height: 1.08; margin: 0; text-wrap: balance; }
:root[lang="en"] .home-head h1 { letter-spacing: -.031em; }
.home-head p { color: var(--muted); font-size: clamp(17px, 2vw, 20px); line-height: 1.55; margin: 0; max-width: 34em; text-wrap: pretty; }
.group { padding-block: 34px 4px; }
.home-head[hidden] + #groups .group:first-child { padding-top: clamp(28px, 5vw, 48px); }
.group-title { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 2.6vw, 28px); color: var(--ink); margin: 0 0 18px; }
:root[lang="en"] .group-title { letter-spacing: -.02em; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 22px; }
.row-wrap { position: relative; --ext: clamp(16px, calc((100vw - 1520px) / 2 - 8px), 120px); }
.group-row .cards { display: flex; gap: 22px; overflow-x: auto; overflow-y: visible; padding: 6px var(--ext) 18px; margin: -6px calc(-1 * var(--ext)) 0; scrollbar-width: none; overscroll-behavior-x: contain;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--ext), #000 calc(100% - var(--ext)), transparent 100%); mask-image: linear-gradient(to right, transparent 0, #000 var(--ext), #000 calc(100% - var(--ext)), transparent 100%); }
.group-row .cards::-webkit-scrollbar { display: none; }
.group-row .card { flex: 0 0 clamp(150px, 14vw, 230px); scroll-snap-align: start; }
.row-arrow { position: absolute; top: calc(50% - 30px); transform: translateY(-50%); z-index: 3; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--glass-line); background: color-mix(in srgb, var(--surface) 90%, transparent); color: var(--ink); font-size: 32px; line-height: 1; display: grid; place-items: center; padding-bottom: 4px; box-shadow: var(--shadow); transition: opacity .2s, transform .15s; }
.row-arrow:hover:not(:disabled) { transform: translateY(-50%) scale(1.08); }
.row-arrow:disabled { opacity: 0; pointer-events: none; }
.row-prev { inset-inline-start: calc(14px - var(--ext)); } .row-next { inset-inline-end: calc(14px - var(--ext)); }
:root:not([dir="rtl"]) .row-arrow { transform: translateY(-50%) scaleX(-1); } :root:not([dir="rtl"]) .row-arrow:hover:not(:disabled) { transform: translateY(-50%) scaleX(-1) scale(1.08); }
@media (max-width: 560px) { .row-arrow { width: 38px; height: 38px; font-size: 26px; } }
.group-title { display: flex; align-items: center; gap: 12px; }
.gt-acc { width: 5px; height: 1.05em; border-radius: 5px; background: var(--theme); flex: none; }
.gt-cnt { color: var(--muted); font-size: .62em; font-weight: 400; }
.hero { position: relative; margin-top: clamp(20px, 3vw, 32px); min-height: 380px; border-radius: 32px; overflow: hidden; border: 1px solid var(--glass-line); background: linear-gradient(110deg, color-mix(in srgb, var(--surface) 92%, transparent) 0%, color-mix(in srgb, var(--surface) 70%, transparent) 45%, color-mix(in srgb, var(--theme) 75%, transparent) 135%); box-shadow: var(--shadow); }
.hero-txt { position: relative; z-index: 2; padding: clamp(28px, 5vw, 64px); max-width: 600px; transition: opacity .26s, transform .26s; }
.hero-tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink); background: color-mix(in srgb, var(--theme) 22%, transparent); }
.hero-tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--theme); }
.hero-h { font-family: var(--display); font-weight: 600; font-size: clamp(38px, 5vw, 62px); line-height: 1.1; margin: 16px 0 10px; }
.hero-p { color: var(--muted); font-size: clamp(16px, 1.6vw, 19px); line-height: 1.6; margin: 0 0 26px; }
.hero-go { border: 0; border-radius: 999px; padding: 15px 34px; background: var(--theme); color: var(--on-theme, #fff); font-weight: 700; font-size: 17px; box-shadow: 0 10px 26px color-mix(in srgb, var(--theme) 35%, transparent); transition: transform .15s; }
.hero-go:hover { transform: translateY(-2px); }
.hero-ph { position: absolute; inset-block: 0; inset-inline-end: 0; width: min(46%, 520px); transition: opacity .26s, transform .26s; }
.hp { position: absolute; height: 84%; aspect-ratio: 9 / 16; border-radius: 22px; object-fit: cover; box-shadow: 0 30px 60px rgba(0, 0, 0, .45); cursor: pointer; transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s, filter .35s; --r: 0deg; transform: rotate(var(--r)); will-change: transform; }
.hp0 { inset-inline-end: 54%; top: 12%; --r: 8deg; filter: brightness(.9); }
.hp1 { inset-inline-end: 6%; top: 10%; --r: -6deg; }
.hp2 { inset-inline-end: 28%; top: 7%; height: 88%; z-index: 2; --r: 2deg; }
[dir="rtl"] .hp0 { --r: -8deg; } [dir="rtl"] .hp1 { --r: 6deg; } [dir="rtl"] .hp2 { --r: -2deg; }
.hp:hover { transform: translateY(-10px) rotate(var(--r)) scale(1.03); z-index: 3; filter: none; box-shadow: 0 40px 70px rgba(0, 0, 0, .55); }
.hero-dots { position: absolute; z-index: 2; bottom: 22px; inset-inline-start: clamp(28px, 5vw, 64px); display: flex; gap: 7px; }
.hero-dots button { position: relative; width: 8px; height: 8px; padding: 0; border: 0; border-radius: 9px; cursor: pointer; background: color-mix(in srgb, var(--ink) 25%, transparent); transition: width .25s, background .25s; }
.hero-dots button::before { content: ""; position: absolute; inset: -10px -5px; }
.hero-dots button:hover { background: color-mix(in srgb, var(--ink) 50%, transparent); }
.hero-dots button.on { width: 26px; background: var(--theme); }
.hero.swap .hero-txt, .hero.swap .hero-ph { opacity: 0; transform: translateY(8px); }
.group-pair { display: flex; gap: clamp(28px, 4vw, 64px); align-items: flex-start; }
.group-pair > .group { flex: 1 1 0; min-width: 0; }
.group-pair .row-wrap { --ext: 14px; }
@media (max-width: 900px) { .group-pair { display: block; } }
.hero[hidden] { display: none; }
.hero-go { display: none !important; }
.hero-p { margin-bottom: 0; }
@media (max-width: 760px) { .hero { min-height: 0; } .hero-ph { display: none; } .hero-txt { padding-bottom: 54px; } }
.card { display: flex; flex-direction: column; gap: 8px; text-align: start; background: none; border: 0; padding: 0; }
.card-img { display: block; aspect-ratio: 9 / 16; max-width: 100%; border-radius: 24px; overflow: hidden; background: var(--soft); border: 1px solid var(--glass-line); box-shadow: var(--shadow-sm); transition: transform .3s, box-shadow .3s; }
.card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card:hover .card-img { transform: translateY(-5px); box-shadow: var(--shadow); }
.card-name { font-family: var(--display); font-weight: 500; font-size: 16px; line-height: 1.3; }
.card-tag { font-size: 12px; color: var(--muted); margin-top: -6px; }

/* make */
#make { max-width: 1180px; margin: 0 auto; }
.make-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 28px 22px; }
/* back to all templates: a frosted-glass pill that stays at the top while scrolling the editor */
.back { position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 25; display: flex; width: fit-content; margin-top: 24px; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--glass-line); background: color-mix(in srgb, var(--surface) 90%, transparent); box-shadow: var(--shadow-sm); color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer; transition: box-shadow .2s, transform .15s; }
.back:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
[dir="rtl"] .back-arrow { transform: scaleX(-1); }
#make-title { font-family: var(--display); font-weight: 300; font-size: clamp(32px, 4.6vw, 48px); line-height: 1.1; margin: 0; flex-basis: 100%; }
:root[lang="en"] #make-title { letter-spacing: -.03em; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: start; }
.steps-col { min-width: 0; max-width: 600px; display: flex; flex-direction: column; gap: 14px; }
#steps { display: flex; flex-direction: column; gap: 14px; }
.part { font-family: var(--display); font-weight: 500; font-size: 14px; color: var(--muted); margin: 18px 6px 0; }
.part:first-child { margin-top: 0; }

.step { background: color-mix(in srgb, var(--surface) 82%, transparent); border: 1px solid var(--glass-line); /* no backdrop blur here: many blurred cards make scrolling slow */ border-radius: var(--r); padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow-sm); transition: box-shadow .25s; }
.step:focus-within { box-shadow: var(--shadow), 0 0 0 2px color-mix(in srgb, var(--theme) 40%, transparent); }
.step-head { display: flex; align-items: center; gap: 12px; }
.step-num { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 13px; background: var(--soft); color: var(--muted); font-variant-numeric: tabular-nums; transition: background .2s, color .2s; }
.step.is-done .step-num { background: var(--theme); color: #fff; }
.step-title { margin: 0; font-family: var(--display); font-weight: 500; font-size: 17px; flex: 1; min-width: 0; }
.step-title label { cursor: pointer; }
.step-body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.inner { display: flex; flex-direction: column; gap: 8px; }
.inner + .inner { padding-top: 12px; border-top: 1px dashed var(--line); }
.inner-label { margin: 0; font-size: 13px; color: var(--muted); }
.inner-label label { cursor: pointer; }

.txt { width: 100%; border: 1px solid var(--line); background: var(--field); border-radius: 18px; padding: 12px 16px; font-size: 15px; line-height: 1.7; resize: vertical; transition: border-color .2s, background .2s, box-shadow .2s; }
.txt:not(.emoji-in) { font-family: var(--body) !important; font-weight: 400; } /* plain interface text, not the template's display font */
.txt:focus { outline: none; border-color: color-mix(in srgb, var(--theme) 60%, var(--line)); background: var(--surface); box-shadow: 0 0 0 4px color-mix(in srgb, var(--theme) 14%, transparent); }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.hint.is-note { color: var(--note); }
.link { align-self: flex-start; background: none; border: 0; padding: 4px 0; color: var(--ink); font-weight: 500; font-size: 14px; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
.link:hover { text-decoration-color: currentColor; }
.link.quiet { color: var(--muted); }
.tools { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--field); font-size: 18px; line-height: 1; display: grid; place-items: center; }
.icon-btn:hover { border-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--field); color: var(--muted); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500; line-height: 1.3; }
.has-tip { position: relative; }
.has-tip::after { content: attr(data-tip); position: absolute; top: calc(100% + 7px); left: 50%; transform: translateX(-50%); padding: 5px 10px; border-radius: 9px; background: color-mix(in srgb, var(--bg) 55%, transparent); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); box-shadow: 0 4px 14px rgba(0, 0, 0, .12); color: var(--ink); font: 600 12px/1.2 system-ui, sans-serif; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .08s; z-index: 20; direction: ltr; }
.has-tip:hover::after, .has-tip:focus-visible::after { opacity: 1; }
.chip-icon { min-width: 34px; padding-inline: 8px; font-size: 15px; }
.chip:hover { border-color: var(--ink); color: var(--ink); }
.chip[aria-checked="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
/* story slots: the tiles above are the upload boxes, so the big drop box under them is left out */
.story-panel .drop { display: none; }
.step.music.is-off .step-body > :not(.hint) { opacity: .5; }
.len-list { display: flex; flex-direction: column; gap: 10px; }
.media-compact { display: flex; gap: 14px; align-items: flex-start; }
.media-compact .mc-side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.media-compact .mc-side .hint { margin: 0; font-size: 12.5px; }
.drop.drop-slot { flex: none; width: 92px; height: 122px; padding: 5px; border-radius: 18px; justify-content: center; }
.drop.drop-slot .drop-thumb { width: 100%; height: 100%; border-radius: 13px; }
.is-off { opacity: .45; } .is-off .chip, .trim.is-off input { cursor: not-allowed; }
.trim { display: flex; flex-direction: column; gap: 8px; }
.trim-bar { position: relative; height: 34px; }
.trim-track, .trim-fill { position: absolute; top: 13px; height: 8px; border-radius: 99px; }
.trim-track { left: 0; right: 0; background: color-mix(in srgb, currentColor 14%, transparent); }
.trim-fill { background: var(--theme); }
.trim-bar input[type=range] { position: absolute; inset: 0; width: 100%; height: 34px; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
.trim-bar input[type=range]::-webkit-slider-runnable-track { background: none; height: 34px; }
.trim-bar input[type=range]::-moz-range-track { background: none; }
.trim-bar input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 22px; height: 30px; margin-top: 2px; border-radius: 8px; background: #fff; border: 3px solid var(--theme); box-shadow: 0 1px 4px rgba(0,0,0,.25); cursor: ew-resize; }
.trim-bar input[type=range]::-moz-range-thumb { pointer-events: auto; width: 16px; height: 24px; border-radius: 8px; background: #fff; border: 3px solid var(--theme); cursor: ew-resize; }
.trim-info { font-size: 13px; opacity: .75; font-variant-numeric: tabular-nums; }
.more { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; background: var(--soft); }
.more small { color: var(--muted); }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row label { font-size: 14px; min-width: 7em; }
.row input[type=range] { flex: 1; min-width: 120px; accent-color: var(--theme); }
.row output { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.select { border: 1px solid var(--line); background: var(--field); border-radius: 999px; padding: 8px 10px; font-size: 14px; max-width: 100%; }
select option, select optgroup { background: var(--surface); color: var(--ink); }
select optgroup { color: var(--muted); font-weight: 600; }
.emoji-in { font-size: 26px; padding: 4px 10px; text-align: center; width: 5em; }
.correct { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.correct input { accent-color: var(--theme); margin: 0; width: 16px; height: 16px; }
.correct:has(input:checked) { color: var(--ink); font-weight: 600; }

.drop { display: flex; gap: 14px; align-items: center; border: 1.5px dashed color-mix(in srgb, var(--ink) 18%, transparent); border-radius: 20px; padding: 10px; cursor: pointer; background: var(--field); transition: border-color .2s, background .2s; }
.drop:hover, .drop.over { border-color: var(--theme); background: var(--surface); }
.stories-txt { min-height: 220px; }
.story-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 10px; }
